name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: Install Nomad
        run: |
          curl -fsSL -o nomad.zip https://releases.hashicorp.com/nomad/1.11.3/nomad_1.11.3_linux_amd64.zip
          unzip nomad.zip && sudo mv nomad /usr/local/bin/
      - name: Integration tests (single-node nomad agent)
        run: go test -tags integration -run Integration -v ./...

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix flake check
      - run: nix build .#narc

  # Every push to main publishes ghcr.io/3ft9/narc:latest, plus an immutable
  # sha-<short> tag to pin deployments to. Releases publish version tags only.
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, nix]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build binaries
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -ldflags "-s -w -X main.version=main-${GITHUB_SHA::7}" -o linux/$arch/narc .
          done
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/3ft9/narc:latest
            ghcr.io/3ft9/narc:sha-${{ env.SHORT_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/3ft9/narc
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
